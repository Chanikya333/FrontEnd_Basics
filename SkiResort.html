<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ski Resort Exercise</title>
        <style>
            body {
                background-color: #463d36;
                color: #463d36;
                font-family: sans-serif;
                margin: 100px auto;
            }

            .container {
                background-color: white;
                width: 600px;
                margin: 100px auto;
                border-radius: 20px;
                padding: 40px;
                text-transform: uppercase;
            }

            .container button {
                background-color: #463d36;
                font-weight: bold;
                text-transform: uppercase;
                color: white;
                font-size: 24px;
                padding: 30px 40px;
                border-radius: 10px;
            }

            .container h2 {
                color: #a6192e;
                font-size: 28px;
                margin: 0;
                text-transform: uppercase;
            }

            .container h1 {
                margin-top: 0px;
                margin-bottom: 28px;
                font-size: 40px;
                text-transform: uppercase;
                font-weight: 100;
            }

            .container p {
                font-size: 28px;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h2>Open daily 9am-4pm</h2>
            <h1>Banana Peel Now Open!</h1>
            <p>Winter has seriously delivered so far, and Banana Peel is now open for the season!</p>
            <button>Lift &amp; Terrain Status</button>
        </div>
    </body>

</html>
